schema_version: 1
project:
  name: market-rank
  locale: us
paths:
  data_dir: data
  artifacts_dir: artifacts
  experiments_dir: experiments
  reports_dir: reports
runtime:
  seed: 20260801
  max_threads: 4
  rss_limit_mb: 5632
  offline: true
dataset:
  query_normalization_version: nfkc-casefold-ws-v1
  split_version: normalized-query-sha256-v1
  profile_version: nested-query-sha256-v1
  train_basis_points: 8500
  development_query_groups: 5000
  portfolio_query_groups: 20000
  product_document_version: product-document-v1
  title_max_chars: 512
  brand_max_chars: 128
  color_max_chars: 128
  bullets_max_chars: 2048
  description_max_chars: 4096
  m2_runtime_reserve_mb: 512
retrieval:
  sparse:
    tokenizer_version: unicode-word-v1
    component_version: bm25-v1
    k1: 1.2
    b: 0.75
    default_top_k: 150
    max_top_k: 1000
    sqlite_batch_rows: 10000
  dense:
    model_id: sentence-transformers/all-MiniLM-L6-v2
    model_revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    component_version: minilm-l6-v2-flatip-v1
    embedding_dimension: 384
    embedding_batch_size: 16
    default_top_k: 150
    max_top_k: 1000
    latency_sample_queries: 20
    model_cache_dir: models/huggingface
  hybrid:
    component_version: rrf-v1
    rrf_constant: 60
    sparse_top_k: 150
    dense_top_k: 150
    union_top_k: 200
    max_union_top_k: 1000
evaluation:
  component_version: retrieval-eval-v1
  default_profile: development
  cutoffs: [10, 100]
  bootstrap_replicates: 1000
  bootstrap_batch_replicates: 100
  candidate_partition_rows: 100000
  metric_partition_rows: 100000
query_understanding:
  parser_version: query-parser-v1
  max_query_chars: 512
  max_query_bytes: 2048
  max_query_tokens: 64
  brand_min_chars: 2
ranking_features:
  component_version: ranking-features-v1
  feature_set_id: ltr_core_v1
  registry_version: feature-registry-v1
  state_version: feature-state-v1
  matrix_partition_rows: 100000
  query_batch_size: 64
  parity_fixture_rows: 128
  max_rows_per_query: 200
ranker_training:
  component_version: lightgbm-rankers-v1
  population_version: training-population-v1
  pointwise_objective: regression_l2
  lambdamart_objective: lambdarank
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_data_in_leaf: 20
  max_bin: 63
  lambda_l1: 0.0
  lambda_l2: 1.0
  max_boost_rounds: 300
  early_stopping_rounds: 30
  ndcg_eval_at: [10, 20]
  min_group_rows: 2
  min_distinct_labels: 2
  max_train_rows: 500000
  max_validation_rows: 200000
  reload_parity_rows: 128
  explanation_rows: 64
ranking_evaluation:
  component_version: ranking-eval-v1
  selection_split: validation
  closed_cutoffs: [10, 20]
  diagnostic_cutoffs: [10, 100]
  minimum_model_improvement: 0.0
  material_regression_tolerance: 0.005
  selection_tie_tolerance: 1.0e-12
  failure_analysis_queries: 20
  max_closed_rows: 200000
  max_candidate_rows: 200000
serving:
  component_version: serving-bundle-v1
  bind_host: 127.0.0.1
  port: 8000
  default_top_k: 10
  max_response_top_k: 50
  default_deadline_ms: 1000
  max_deadline_ms: 3000
  max_concurrency: 2
  max_request_body_bytes: 16384
  max_debug_candidates: 20
  description_snippet_chars: 240
  product_store_batch_rows: 10000
  allow_degraded_retrieval: true
  allow_ranker_fallback: true
  debug_enabled: true
demo:
  component_version: streamlit-demo-v1
  api_base_url: http://127.0.0.1:8000
  bind_host: 127.0.0.1
  port: 8501
  request_timeout_seconds: 5.0
  default_top_k: 10
  max_comparison_modes: 4
  max_product_cards: 12
  example_queries:
    - wireless mouse
    - running shoes men
    - iphone 13 case
    - coffee maker
    - blue dress
qualification:
  component_version: release-qualification-v1
  generation: rc1
  required_system: Darwin
  required_machine: arm64
  required_chip: Apple M3
  required_memory_bytes: 8589934592
  required_power_source: AC Power
  require_clean_revision: true
  warmup_rounds: 2
  measured_rounds: 5
  concurrency_workers: 2
  concurrency_rounds: 3
  top_k: 10
  cold_startup_target_ms: 30000.0
  request_p95_target_ms: 1000.0
  concurrency_p95_target_ms: 1500.0
  parse_p95_target_ms: 50.0
  sparse_p95_target_ms: 200.0
  dense_p95_target_ms: 200.0
  fusion_p95_target_ms: 50.0
  features_p95_target_ms: 250.0
  ranker_p95_target_ms: 50.0
  modes: [active, bm25, dense, hybrid, pointwise, lambdamart]
  queries:
    - wireless mouse
    - running shoes men
    - iphone 13 case
    - coffee maker
    - blue dress
logging:
  level: INFO
  format: json
  log_raw_queries: false
