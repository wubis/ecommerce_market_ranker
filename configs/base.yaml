schema_version: 1
project:
  name: market-rank
  locale: us
paths:
  data_dir: data
  artifacts_dir: artifacts
  experiments_dir: experiments
  reports_dir: reports
runtime:
  seed: 20260801
  max_threads: 4
  rss_limit_mb: 5632
  offline: true
dataset:
  query_normalization_version: nfkc-casefold-ws-v1
  split_version: normalized-query-sha256-v1
  profile_version: nested-query-sha256-v1
  train_basis_points: 8500
  development_query_groups: 5000
  portfolio_query_groups: 20000
  product_document_version: product-document-v1
  title_max_chars: 512
  brand_max_chars: 128
  color_max_chars: 128
  bullets_max_chars: 2048
  description_max_chars: 4096
  m2_runtime_reserve_mb: 512
retrieval:
  sparse:
    tokenizer_version: unicode-word-v1
    component_version: bm25-v1
    k1: 1.2
    b: 0.75
    default_top_k: 150
    max_top_k: 1000
    sqlite_batch_rows: 10000
logging:
  level: INFO
  format: json
  log_raw_queries: false
