[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "market-rank"
version = "0.1.0"
description = "CPU-first multi-stage e-commerce search and ranking system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "TBD" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "faiss-cpu>=1.14,<2",
  "fastapi>=0.139,<0.140",
  "lightgbm>=4.7,<5",
  "numpy>=2,<3",
  "polars>=1.32,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "sentence-transformers>=5.6,<6",
  "uvicorn>=0.51,<0.52",
]

[project.scripts]
market-rank = "market_rank.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_rank"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "artifacts",
  "data",
  "experiments",
  "mlruns",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]
